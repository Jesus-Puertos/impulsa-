# =============================================================================
# Configuración del proyecto Supabase - Cooperativa Impulsa
# Usada por la CLI (`supabase start`, `supabase db reset`, `supabase db push`).
# Documentación: https://supabase.com/docs/guides/local-development/cli/config
# =============================================================================

project_id = "impulsa"

[api]
enabled = true
port = 54321
# `privado` NO se expone: contiene los helpers de autorización y las funciones
# internas, que solo deben invocarse desde otras funciones de la base.
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

# Captura de correos en local: los mensajes de verificación y recuperación se
# abren en http://localhost:54324 en lugar de enviarse de verdad.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:4321"
additional_redirect_urls = ["http://localhost:4321/portal", "http://localhost:4321/admin"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# En local se deja en false para no tener que confirmar el correo en cada
# prueba. En producción DEBE estar en true (se configura en el panel).
enable_confirmations = false
secure_password_change = true

[auth.email.template.confirmation]
subject = "Confirma tu correo - Cooperativa Impulsa"

[auth.email.template.recovery]
subject = "Restablece tu contraseña - Cooperativa Impulsa"

[analytics]
enabled = false
